<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Data Viewer</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f39c12;
            --primary-dark: #d35400;
            --bg-dark: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --success: #2ecc71;
            --error: #e74c3c;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-x: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 16px 0;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card.collapsed h1 {
            margin-bottom: 0;
        }

        #collapseBtn {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 8px;
            box-shadow: none;
            font-weight: 400;
        }

        #collapseBtn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        #collapseBtn svg {
            transition: transform 0.3s ease;
        }

        .card.collapsed #collapseBtn svg {
            transform: rotate(180deg);
        }

        .card.collapsed .editor-body {
            display: none;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 400;
            box-shadow: none;
        }

        button.secondary:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: none;
        }

        .hint {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-left: auto;
        }

        #error-message {
            display: none;
            background: rgba(231, 76, 60, 0.1);
            border-left: 4px solid var(--error);
            padding: 12px;
            margin-top: 16px;
            border-radius: 4px;
            color: #ff9999;
            font-size: 0.85rem;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            white-space: pre-wrap;
        }

        #status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 12px;
            min-height: 1.1em;
            font-variant-numeric: tabular-nums;
        }

        #status.success {
            color: var(--success);
        }

        .results-wrap {
            flex: 1;
            min-height: 120px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8rem;
        }

        th, td {
            text-align: left;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            position: sticky;
            top: 0;
            background: #1e1a14;
            color: var(--primary);
            font-weight: 600;
            z-index: 1;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        td.null {
            color: var(--text-muted);
            font-style: italic;
        }

        td.num {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="card" id="editorCard">
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
            SQL Data Viewer
            <button id="collapseBtn" title="Collapse SQL editor">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </button>
        </h1>
        <div class="editor-body">
            <div class="description">Run read-only SQLite queries against this document via the Grist /sql API.</div>

            <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM MyTable LIMIT 100">SELECT name FROM sqlite_master WHERE type='table' ORDER BY name</textarea>

            <div class="toolbar">
                <button id="runBtn">Run Query</button>
                <button id="tablesBtn" class="secondary">List Tables</button>
                <button id="csvBtn" class="secondary" disabled>Export CSV</button>
                <span class="hint">Ctrl/⌘ + Enter to run</span>
            </div>

            <div id="error-message"></div>
            <div id="status">Enter a SELECT query and hit Run.</div>
        </div>
    </div>

    <div class="results-wrap">
        <div id="results" class="empty">No results yet</div>
    </div>

    <script>
        const MAX_RENDER_ROWS = 2000;

        const card = document.getElementById('editorCard');
        const collapseBtn = document.getElementById('collapseBtn');
        const sqlInput = document.getElementById('sql');
        const runBtn = document.getElementById('runBtn');
        const tablesBtn = document.getElementById('tablesBtn');
        const csvBtn = document.getElementById('csvBtn');
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error-message');
        const resultsEl = document.getElementById('results');

        let lastResult = null; // {columns, rows} for CSV export
        let cachedToken = null; // {token, baseUrl, expiresAt}
        let isRunning = false;
        let optionsLoaded = false;

        grist.ready({ requiredAccess: 'full' });

        // Restore persisted widget state (saved query + collapsed editor)
        grist.onOptions((options) => {
            options = options || {};
            setCollapsed(!!options.collapsed);
            if (optionsLoaded) return; // don't clobber the editor after initial load
            optionsLoaded = true;
            if (options.sql) {
                sqlInput.value = options.sql;
                runQuery();
            }
        });

        function setCollapsed(collapsed) {
            card.classList.toggle('collapsed', collapsed);
            collapseBtn.title = collapsed ? 'Expand SQL editor' : 'Collapse SQL editor';
        }

        collapseBtn.onclick = () => {
            const collapsed = !card.classList.contains('collapsed');
            setCollapsed(collapsed);
            grist.setOption('collapsed', collapsed).catch(err => console.warn('Could not save collapsed state', err));
        };

        async function getToken() {
            if (cachedToken && Date.now() < cachedToken.expiresAt) {
                return cachedToken;
            }
            const info = await grist.docApi.getAccessToken({ readOnly: true });
            cachedToken = {
                token: info.token,
                baseUrl: info.baseUrl,
                // Refresh 30s before actual expiry
                expiresAt: Date.now() + (info.ttlMsecs || 60000) - 30000,
            };
            return cachedToken;
        }

        function setStatus(text, kind) {
            statusEl.textContent = text;
            statusEl.className = kind || '';
        }

        function showError(msg) {
            errorEl.innerText = `Error: ${msg}`;
            errorEl.style.display = 'block';
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        function formatCell(value) {
            const td = document.createElement('td');
            if (value === null || value === undefined) {
                td.textContent = 'NULL';
                td.className = 'null';
            } else if (typeof value === 'number') {
                td.textContent = String(value);
                td.className = 'num';
            } else if (typeof value === 'object') {
                td.textContent = JSON.stringify(value);
            } else {
                td.textContent = String(value);
            }
            td.title = td.textContent;
            return td;
        }

        function renderTable(records) {
            resultsEl.className = '';
            resultsEl.innerHTML = '';

            if (records.length === 0) {
                resultsEl.className = 'empty';
                resultsEl.textContent = 'Query returned no rows';
                lastResult = null;
                csvBtn.disabled = true;
                return 0;
            }

            // Union of keys across rows, preserving first-seen order
            const columns = [];
            const seen = new Set();
            for (const rec of records) {
                for (const key of Object.keys(rec.fields)) {
                    if (!seen.has(key)) {
                        seen.add(key);
                        columns.push(key);
                    }
                }
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            for (const col of columns) {
                const th = document.createElement('th');
                th.textContent = col;
                headRow.appendChild(th);
            }
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            const shown = records.slice(0, MAX_RENDER_ROWS);
            for (const rec of shown) {
                const tr = document.createElement('tr');
                for (const col of columns) {
                    tr.appendChild(formatCell(rec.fields[col]));
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            resultsEl.appendChild(table);

            lastResult = {
                columns,
                rows: records.map(r => columns.map(c => r.fields[c])),
            };
            csvBtn.disabled = false;

            return records.length;
        }

        async function runQuery() {
            if (isRunning) return;

            const sql = sqlInput.value.trim();
            if (!sql) {
                showError('Please enter a query.');
                return;
            }

            isRunning = true;
            runBtn.disabled = true;
            runBtn.innerHTML = '<div class="spinner"></div> Running...';
            hideError();
            setStatus('Running...');
            const started = performance.now();

            try {
                const { token, baseUrl } = await getToken();
                const response = await fetch(`${baseUrl}/sql?auth=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql, timeout: 1000 }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || `Server returned ${response.status}`);
                }

                const elapsed = Math.round(performance.now() - started);
                const count = renderTable(data.records || []);
                const truncated = count > MAX_RENDER_ROWS ? ` (showing first ${MAX_RENDER_ROWS})` : '';
                setStatus(`${count} row${count === 1 ? '' : 's'}${truncated} in ${elapsed} ms`, 'success');

                // Persist the query so it survives reloads
                grist.setOption('sql', sql).catch(err => console.warn('Could not save query', err));
            } catch (err) {
                console.error(err);
                showError(err.message);
                setStatus('');
                resultsEl.className = 'empty';
                resultsEl.textContent = 'Query failed';
                lastResult = null;
                csvBtn.disabled = true;
            } finally {
                isRunning = false;
                runBtn.disabled = false;
                runBtn.innerHTML = 'Run Query';
            }
        }

        function exportCsv() {
            if (!lastResult) return;
            const escape = (v) => {
                if (v === null || v === undefined) return '';
                const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            const lines = [lastResult.columns.map(escape).join(',')];
            for (const row of lastResult.rows) {
                lines.push(row.map(escape).join(','));
            }
            const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
            link.download = `query_results_${dateStr}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        runBtn.onclick = runQuery;
        csvBtn.onclick = exportCsv;
        tablesBtn.onclick = () => {
            sqlInput.value = "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name";
            runQuery();
        };
        sqlInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runQuery();
            }
        });
    </script>
</body>

</html>
