<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived design</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --bg: #ffffff; --card: #ffffff; --text: #262633; --muted: #686881;
      --border: #e2e4ea; --pill: #f2f3f7; --accent: #16b378; --accent-text: #ffffff;
      --link: #1d6fd6; --warn-bg: #fff6e0; --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262633; --card: #2f2f3d; --text: #efeff4; --muted: #a9a9bc;
        --border: #44445a; --pill: #3a3a4b; --accent: #17b378; --accent-text: #ffffff;
        --link: #6fb0ff; --warn-bg: #4a3b16; --warn: #ffd88a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 10px; background: var(--bg); color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    header .who { color: var(--muted); font-size: 12px; }
    button, .btn {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 6px 10px;
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .btn.primary, button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .link-btn { border: 0; background: none; padding: 0; color: var(--link); font-weight: 500; }
    .card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 10px; margin-bottom: 10px; }
    .title { font-weight: 600; word-break: break-word; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; margin-right: 6px; }
    .badge.archived { background: #e6f6ef; color: #0d7a50; }
    .badge.active { background: #eaf1fd; color: #1d5fb8; }
    .preview { display: block; width: 100%; margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; min-height: 60px; }
    .caption { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .group { margin-top: 8px; }
    .group h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .pill { display: inline-block; background: var(--pill); border-radius: 4px; padding: 2px 7px; margin: 0 4px 4px 0; font-size: 12px; }
    .pill b { font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 8px; margin-top: 8px; font-size: 12px; }
    .empty { color: var(--muted); padding: 24px 8px; text-align: center; }
    .uploader h3 { margin: 0 0 6px; font-size: 13px; }
    .uploader input[type=file] { display: block; width: 100%; margin: 6px 0; font: inherit; color: var(--text); }
    .uploader progress { width: 100%; height: 8px; margin-top: 8px; }
    .steps { list-style: none; padding: 0; margin: 8px 0 0; font-size: 12px; }
    .steps li { margin: 2px 0; }
    .steps .done { color: #0d7a50; }
    .steps .fail { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <span class="who" id="who"></span>
    <span id="auth-action"></span>
  </header>
  <main id="app"><div class="empty">Select a row.</div></main>

  <script>
    // All logic lives in app.js, loaded fresh on every open. GitHub Pages lets
    // browsers cache files for 10 minutes, and changing this widget's URL in
    // Grist resets its column mappings, so the URL stays fixed and only app.js
    // changes.
    (() => {
      const script = document.createElement('script');
      script.src = `app.js?t=${Date.now()}`;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
